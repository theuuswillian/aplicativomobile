name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: granaviva-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Export generated lockfile for pinning
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: granaviva-package-lock
          path: package-lock.json
          retention-days: 7
      - run: npm run lint
      - run: npm run check:policy
      - run: npm run check:secrets
      - name: Validate shell scripts
        run: bash -n scripts/test-sql.sh && bash -n scripts/test-sql-concurrency.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: granaviva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d granaviva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migrations, RLS and concurrency on PostgreSQL 17
        run: bash scripts/test-sql.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/granaviva_test
