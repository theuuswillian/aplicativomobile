name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: granaviva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d granaviva_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:policy
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migrations and RLS on PostgreSQL 17
        run: npm run test:sql
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/granaviva_test
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
